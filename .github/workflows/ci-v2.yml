name: CI (v2)

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  phase2-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start API stack
        run: docker compose up -d --wait
      - name: Run Phase 2 Playwright tests
        run: npm run test:e2e:phase2
        env:
          CI: true
          PHASE2_DOCKER: 'false'
          PHASE2_SKIP_DOCKER: 'true'
          VITE_CLOUD_ENABLED: 'true'
          VITE_API_BASE_URL: http://localhost:3000
      - name: Collect PR videos
        if: always()
        run: |
          mkdir -p e2e/artifacts/pr-videos
          echo "=== Named PR recordings ==="
          ls -lh e2e/artifacts/pr-videos/*.webm 2>/dev/null || echo "(no .webm files yet)"
          if [ -f e2e/artifacts/pr-videos/manifest.json ]; then
            echo "=== Manifest ==="
            cat e2e/artifacts/pr-videos/manifest.json
          fi
      - name: Upload E2E videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-e2e-videos
          path: |
            e2e/artifacts/pr-videos/*.webm
            e2e/artifacts/pr-videos/manifest.json
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-playwright-report
          path: e2e/artifacts/report/
          if-no-files-found: ignore
      - name: Comment PR with recording links
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const manifestPath = 'e2e/artifacts/pr-videos/manifest.json';
            let lines = [
              '## Phase 2 E2E screen recordings',
              '',
              `Download the **phase2-e2e-videos** artifact from the [workflow run](${runUrl}).`,
              '',
            ];
            if (fs.existsSync(manifestPath)) {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              lines.push('### Happy path videos', '');
              for (const rec of manifest.recordings ?? []) {
                lines.push(`- **\`${rec.file}\`** — ${rec.title}: ${rec.description}`);
              }
            } else {
              lines.push(
                'Expected recordings:',
                '- `phase2-01-app-menu-and-sign-in.webm`',
                '- `phase2-02-read-and-sync.webm`',
                '- `phase2-03-continuation-on-device-b.webm`',
              );
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
      - name: Stop API stack
        if: always()
        run: docker compose down -v
