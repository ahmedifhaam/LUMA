name: Deploy to GitHub Pages

on:
  push:
    # Auto-deploy only the stable V1 line. Phase 2+ work on main does not ship to Pages.
    branches: [v1.0]
    tags: ['v1.*']
  # Manual deploy: run from the default branch (main) so environment rules allow it,
  # while checking out the ref below (defaults to v1.0).
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build and deploy
        required: false
        default: v1.0

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # GitHub Pages project site is served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
