name: Configure Pages environment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-pages-env.yml
  workflow_dispatch:

permissions:
  administration: write

jobs:
  configure:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Allow deployments only from v1.* branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const environment_name = 'github-pages';
            const allowed = 'v1.*';
            const { data } = await github.rest.repos.getAllDeploymentBranchPolicies({
              owner,
              repo,
              environment_name,
            });
            for (const policy of data.branch_policies) {
              if (policy.name !== allowed) {
                await github.rest.repos.deleteDeploymentBranchPolicy({
                  owner,
                  repo,
                  environment_name,
                  branch_policy_id: policy.id,
                });
              }
            }
            const { data: refreshed } = await github.rest.repos.getAllDeploymentBranchPolicies({
              owner,
              repo,
              environment_name,
            });
            if (!refreshed.branch_policies.some((policy) => policy.name === allowed)) {
              await github.rest.repos.createDeploymentBranchPolicy({
                owner,
                repo,
                environment_name,
                name: allowed,
                type: 'branch',
              });
            }

      - name: Trigger v1.0 Pages deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'v1.0',
            });
